<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fondo de login gastronómico peruano</title>
<desc>Composición minimalista sobre madera clara con ajíes peruanos, maíz morado y choclo, papas nativas, limón, cilantro, quinua, cuchara de madera, tenedor y una cazuela de barro con ají amarillo molido, dispuestos en diagonal en el lado izquierdo, dejando amplio espacio negativo cálido a la derecha para el formulario de acceso.</desc>
<defs>
<linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#F6ECDA"/>
<stop offset="55%" stop-color="#F1E4CB"/>
<stop offset="100%" stop-color="#F8F3E7"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="1920" height="1080" fill="url(#wood)"/>
<g stroke="#DFCEA9" stroke-width="1" opacity="0.45">
<line x1="0" y1="90" x2="1920" y2="80"/>
<line x1="0" y1="260" x2="1920" y2="275"/>
<line x1="0" y1="440" x2="1920" y2="425"/>
<line x1="0" y1="620" x2="1920" y2="635"/>
<line x1="0" y1="800" x2="1920" y2="785"/>
<line x1="0" y1="960" x2="1920" y2="975"/>
</g>

<circle cx="330" cy="900" r="200" fill="#C77B3A" opacity="0.08"/>

<!-- cuchara de madera -->
<g transform="translate(190,760)">
<ellipse cx="0" cy="46" rx="112" ry="24" fill="#8A5A34" opacity="0.30"/>
<path d="M-78,40 Q-84,-22 -26,-38 Q28,-48 54,0 Q28,42 -78,40 Z" fill="#B5652E"/>
<path d="M-78,40 Q-40,54 14,46" fill="none" stroke="#8A4A22" stroke-width="3" opacity="0.5"/>
</g>

<!-- ajíes -->
<g transform="translate(330,620) rotate(-18)">
<path d="M0,0 C10,-58 -16,-122 26,-154 C10,-106 32,-58 16,0 Z" fill="#F2A93B"/>
<path d="M0,0 C10,-58 -16,-122 26,-154" fill="none" stroke="#C8801F" stroke-width="2.5"/>
<path d="M24,-148 q5,-16 16,-16" fill="none" stroke="#4A6B2A" stroke-width="5" stroke-linecap="round"/>
</g>
<g transform="translate(400,672) rotate(10)">
<path d="M0,0 C16,-52 -10,-110 36,-132 C16,-90 36,-48 20,4 Z" fill="#E8622E"/>
<path d="M0,0 C16,-52 -10,-110 36,-132" fill="none" stroke="#B03F16" stroke-width="2.5"/>
<path d="M34,-126 q5,-15 15,-15" fill="none" stroke="#4A6B2A" stroke-width="5" stroke-linecap="round"/>
</g>
<g transform="translate(255,662) rotate(-32)">
<path d="M0,0 C14,-48 -8,-96 32,-116 C16,-80 32,-42 16,4 Z" fill="#A33220"/>
<path d="M0,0 C14,-48 -8,-96 32,-116" fill="none" stroke="#711E12" stroke-width="2.5"/>
<path d="M30,-110 q5,-13 14,-13" fill="none" stroke="#4A6B2A" stroke-width="5" stroke-linecap="round"/>
</g>

<!-- rocoto -->
<g transform="translate(400,530)">
<ellipse cx="0" cy="0" rx="50" ry="45" fill="#B4321F"/>
<ellipse cx="-16" cy="-13" rx="18" ry="13" fill="#C94A32" opacity="0.7"/>
<path d="M0,-42 q8,-16 21,-13" fill="none" stroke="#3D5A22" stroke-width="6" stroke-linecap="round"/>
</g>

<!-- choclo -->
<g transform="translate(570,800)">
<ellipse cx="0" cy="26" rx="146" ry="26" fill="#8A5A34" opacity="0.28"/>
<rect x="-37" y="-154" width="74" height="180" rx="37" fill="#F5D949"/>
<g fill="#E7B92A">
<circle cx="-16" cy="-112" r="8.4"/><circle cx="13" cy="-112" r="8.4"/>
<circle cx="-21" cy="-80" r="8.4"/><circle cx="8" cy="-80" r="8.4"/>
<circle cx="-16" cy="-48" r="8.4"/><circle cx="16" cy="-48" r="8.4"/>
<circle cx="-21" cy="-16" r="8.4"/><circle cx="11" cy="-16" r="8.4"/>
</g>
<path d="M-37,-148 q-32,-38 -10,-80" fill="none" stroke="#7A9A46" stroke-width="10" stroke-linecap="round"/>
<path d="M37,-142 q26,-42 5,-85" fill="none" stroke="#7A9A46" stroke-width="10" stroke-linecap="round"/>
</g>

<!-- maiz morado -->
<g transform="translate(680,786)">
<rect x="-34" y="-148" width="68" height="176" rx="34" fill="#5B2D6B"/>
<g fill="#3F1E4C">
<circle cx="-13" cy="-106" r="7.8"/><circle cx="11" cy="-106" r="7.8"/>
<circle cx="-18" cy="-74" r="7.8"/><circle cx="5" cy="-74" r="7.8"/>
<circle cx="-13" cy="-42" r="7.8"/><circle cx="13" cy="-42" r="7.8"/>
<circle cx="-18" cy="-10" r="7.8"/><circle cx="8" cy="-10" r="7.8"/>
</g>
</g>

<!-- papas nativas -->
<g transform="translate(470,880)">
<ellipse cx="0" cy="0" rx="53" ry="37" fill="#6B3FA0"/>
<ellipse cx="-13" cy="-11" rx="21" ry="13" fill="#8358B8" opacity="0.6"/>
</g>
<g transform="translate(720,905)">
<ellipse cx="0" cy="0" rx="48" ry="35" fill="#E8C23B"/>
<ellipse cx="-11" cy="-8" rx="19" ry="11" fill="#F2D666" opacity="0.7"/>
</g>
<g transform="translate(160,915)">
<ellipse cx="0" cy="0" rx="45" ry="32" fill="#EDE1C6"/>
<ellipse cx="-11" cy="-8" rx="16" ry="11" fill="#F8F1DE" opacity="0.8"/>
</g>

<!-- limones -->
<g transform="translate(610,570) rotate(20)">
<circle cx="0" cy="0" r="53" fill="#8FAE3E"/>
<circle cx="0" cy="0" r="53" fill="none" stroke="#6E8C2A" stroke-width="4"/>
<g stroke="#EFE9C9" stroke-width="2.5">
<line x1="0" y1="-42" x2="0" y2="42"/>
<line x1="-37" y1="-24" x2="37" y2="24"/>
<line x1="-37" y1="24" x2="37" y2="-24"/>
</g>
</g>
<g transform="translate(555,470) rotate(-10)">
<path d="M-53,0 Q0,-64 53,0 Q0,26 -53,0 Z" fill="#8FAE3E"/>
<g stroke="#EFE9C9" stroke-width="2.5">
<line x1="-42" y1="0" x2="42" y2="0"/>
<line x1="-26" y1="-21" x2="26" y2="21"/>
<line x1="-26" y1="21" x2="26" y2="-21"/>
</g>
</g>

<!-- huacatay / cilantro -->
<g fill="#4A6B2A">
<g transform="translate(160,470) rotate(-10)"><ellipse cx="0" cy="0" rx="24" ry="11"/><ellipse cx="21" cy="-13" rx="21" ry="9" transform="rotate(-25 21 -13)"/><ellipse cx="-24" cy="-11" rx="21" ry="9" transform="rotate(25 -24 -11)"/></g>
<g transform="translate(250,410) rotate(12)"><ellipse cx="0" cy="0" rx="21" ry="9.5"/><ellipse cx="18" cy="-13" rx="18" ry="8" transform="rotate(-25 18 -13)"/><ellipse cx="-21" cy="-8" rx="18" ry="8" transform="rotate(25 -21 -8)"/></g>
<g transform="translate(475,400) rotate(-6)"><ellipse cx="0" cy="0" rx="21" ry="9.5"/><ellipse cx="18" cy="-13" rx="18" ry="8" transform="rotate(-25 18 -13)"/><ellipse cx="-21" cy="-8" rx="18" ry="8" transform="rotate(25 -21 -8)"/></g>
</g>

<!-- quinua espigas -->
<g fill="#5A7A33" opacity="0.9">
<g transform="translate(345,798) rotate(15)"><path d="M0,0 q16,-38 0,-64 q-16,26 0,64 Z"/></g>
<g transform="translate(372,812) rotate(-10)"><path d="M0,0 q16,-38 0,-64 q-16,26 0,64 Z"/></g>
<g transform="translate(318,820) rotate(30)"><path d="M0,0 q16,-38 0,-64 q-16,26 0,64 Z"/></g>
</g>

<!-- cuenco de aji amarillo molido -->
<g transform="translate(795,720)">
<ellipse cx="0" cy="120" rx="122" ry="24" fill="#8A5A34" opacity="0.28"/>
<path d="M-85,53 Q-106,-26 -26,-21 Q0,-32 26,-21 Q106,-26 85,53 Q0,90 -85,53 Z" fill="#C86B34"/>
<path d="M-80,48 Q0,80 80,48" fill="none" stroke="#A44F1F" stroke-width="3" opacity="0.6"/>
<ellipse cx="0" cy="0" rx="69" ry="27" fill="#E9963B"/>
<ellipse cx="0" cy="0" rx="69" ry="27" fill="none" stroke="#C7761E" stroke-width="2.5"/>
</g>

<!-- cazuela de barro decorativa -->
<g transform="translate(870,760) rotate(-14)">
<rect x="-8" y="-118" width="16" height="150" rx="8" fill="#8A5A2E"/>
<ellipse cx="0" cy="-124" rx="34" ry="48" fill="#9C6A36"/>
</g>

<!-- tenedor -->
<g transform="translate(120,700) rotate(10)">
<rect x="-6.5" y="-116" width="13" height="145" rx="6.5" fill="#B8B8B4"/>
<path d="M-24,-148 L-24,-101 M-8,-153 L-8,-101 M8,-153 L8,-101 M24,-148 L24,-101" stroke="#B8B8B4" stroke-width="9" stroke-linecap="round"/>
<path d="M-24,-101 Q0,-80 24,-101" fill="none" stroke="#B8B8B4" stroke-width="9"/>
</g>

<!-- plato/olla pequeña -->
<g transform="translate(700,910) rotate(6)">
<ellipse cx="0" cy="34" rx="66" ry="15" fill="#8A5A34" opacity="0.22"/>
<path d="M-45,22 Q-53,-31 0,-35 Q53,-31 45,22 Q0,45 -45,22 Z" fill="#D8CBB0"/>
<path d="M-36,14 Q0,31 36,14" fill="none" stroke="#B8AA8C" stroke-width="2.5" opacity="0.6"/>
<ellipse cx="0" cy="-9" rx="34" ry="13" fill="#E8952E"/>
</g>
</svg>
